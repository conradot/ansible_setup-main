---
- name: Garantir diretório de manifestos do Distrobox
  file:
    path: "~/.config/distrobox"
    state: directory
    mode: '0755'

- name: Gerar manifesto do Distrobox para ansible-box
  template:
    src: distrobox.ini.j2
    dest: "~/.config/distrobox/{{ ansible_box_name }}.ini"
    mode: '0644'

- name: Criar e configurar container via Distrobox Assemble
  command: "distrobox assemble create --file ~/.config/distrobox/{{ ansible_box_name }}.ini"
  register: assemble_result
  changed_when: "'creating' in assemble_result.stdout.lower() or 'installing' in assemble_result.stdout.lower()"

- name: Iniciar o container ansible-box
  command: "distrobox enter {{ ansible_box_name }} -- true"
  changed_when: false
