- name: 1. Garantir que o repositório Flathub está presente (User)
  flatpak_remote:
    name: flathub
    state: present
    method: user
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo

- name: 2. Instalar Apps via Flatpak
  flatpak:
    name: "{{ item }}"
    state: present
    method: user
  loop: "{{ apps_flatpaks }}"

- name: 3. Verificar se o Flatpaks estão instalados (Informativo)
  debug:
    msg: "Apps Flatpaks instalados com sucesso!"
