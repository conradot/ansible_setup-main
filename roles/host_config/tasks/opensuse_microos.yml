---
# 1. Configuração do Brilho do Monitor (I2C)
- name: Instalar pacotes para controle de brilho e utilitários via
    transactional-update
  command: transactional-update --non-interactive pkg install ddcutil i2c-tools which
  become: true
  register: i2c_pkg_install
  changed_when: "'Nothing to do' not in i2c_pkg_install.stdout"

- name: Criar grupo de sistema i2c
  group:
    name: i2c
    state: present
    system: yes
  become: true

- name: Adicionar usuário ao grupo i2c
  user:
    name: "{{ host_user }}"
    groups: i2c
    append: yes
  become: true

- name: Configurar regras de Udev para I2C
  copy:
    dest: /etc/udev/rules.d/99-i2c.rules
    content: "KERNEL==\"i2c-[0-9]*\", GROUP=\"i2c\", MODE=\"0660\""
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Configurar carga do módulo i2c-dev no boot
  copy:
    dest: /etc/modules-load.d/i2c.conf
    content: "i2c-dev"
    owner: root
    group: root
    mode: "0644"
  become: true

# 2. Configuração do Bootloader (sdbootutil)
- name: Configurar timeout do systemd-boot
  command: "sdbootutil set-timeout {{ boot_timeout }}"
  become: true
  changed_when: false

# 3. Parâmetros do Kernel (/etc/kernel/cmdline)
- name: Garantir parâmetros do kernel no /etc/kernel/cmdline
  shell: |
    if ! grep -q "{{ item }}" /etc/kernel/cmdline; then
      sed -i 's/$/ {{ item }}/' /etc/kernel/cmdline
      echo "changed"
    fi
  register: kernel_change
  changed_when: "'changed' in kernel_change.stdout"
  loop: "{{ kernel_params }}"
  become: true