---
# 1. Configuração do Brilho do Monitor (I2C)
- name: Instalar pacotes para controle de brilho via transactional-update
  command: transactional-update --non-interactive pkg install ddcutil i2c-tools
  register: i2c_pkg_install
  changed_when: "'Nothing to do' not in i2c_pkg_install.stdout"

- name: Criar grupo de sistema i2c
  group:
    name: i2c
    state: present
    system: yes

- name: Adicionar usuário ao grupo i2c
  user:
    name: "{{ host_user }}"
    groups: i2c
    append: yes

- name: Configurar regras de Udev para I2C
  copy:
    dest: /etc/udev/rules.d/99-i2c.rules
    content: "KERNEL==\"i2c-[0-9]*\", GROUP=\"i2c\", MODE=\"0660\""
    owner: root
    group: root
    mode: "0644"

- name: Configurar carga do módulo i2c-dev no boot
  copy:
    dest: /etc/modules-load.d/i2c.conf
    content: "i2c-dev"
    owner: root
    group: root
    mode: "0644"

# 2. Configuração do Bootloader (sdbootutil)
- name: Configurar timeout do systemd-boot
  command: "sdbootutil set-timeout {{ boot_timeout }}"
  changed_when: false # sdbootutil doesn't report change status easily

# 3. Parâmetros do Kernel (/etc/kernel/cmdline)
- name: Garantir parâmetros do kernel no /etc/kernel/cmdline
  replace:
    path: /etc/kernel/cmdline
    regexp: "^((?!.*{{ item | replace(\".\", \"\\.\") }}).*)$"
    replace: "\\1 {{ item }}"
  loop: "{{ kernel_params }}"
  register: kernel_cmdline_change

# 4. Reparo do TPM2 & sdbootutil
- name: Remover inscrição de TPM antiga (Unenroll)
  command: sdbootutil unenroll --method tpm2
  ignore_errors: yes
  changed_when: false

- name: Reinscrever dispositivo no TPM2
  command: sdbootutil enroll --method tpm2
  ignore_errors: yes # Pode exigir interação manual
  changed_when: false

- name: Reiniciar serviço de predições do sdbootutil
  systemd:
    name: sdbootutil-update-predictions.service
    state: restarted
    enabled: yes
