---
- name: Habilitar lingering para o usuário (rootless systemd)
  command: "loginctl enable-linger {{ ansible_facts['user_id'] }}"
  changed_when: false

- name: Garantir diretório de quadlets do usuário
  file:
    path: "{{ ansible_facts['user_dir'] }}/.config/containers/systemd"
    state: directory
    mode: '0755'

- name: Garantir diretórios de dados da IA no host
  file:
    path: "{{ ai_data_dir }}/{{ item.name }}"
    state: directory
    mode: '0755'
  loop: "{{ ia_stack }}"

- name: Criar arquivo Quadlet do Pod de IA
  template:
    src: ai_pod.pod.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/containers/systemd/{{ ai_pod_name }}.pod"
    mode: '0644'
  notify: reload systemd user

- name: Criar arquivos Quadlet dos containers de IA
  template:
    src: container.container.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/containers/systemd/{{ item.name }}.container"
    mode: '0644'
  loop: "{{ ia_stack }}"
  notify: reload systemd user

- name: Forçar execução dos handlers para recarregar systemd
  meta: flush_handlers

- name: Habilitar e iniciar serviço do Pod de IA
  systemd:
    name: "{{ ai_pod_name }}-pod.service"
    enabled: yes
    state: started
    scope: user
    daemon_reload: yes

- name: Habilitar e iniciar serviços dos containers de IA
  systemd:
    name: "{{ item.name }}.service"
    enabled: yes
    state: started
    scope: user
  loop: "{{ ia_stack }}"
