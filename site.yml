---
- name: Setup Master - Estação Kalpa IA
  hosts: all
  gather_facts: true

  roles:
    - role: host_config
      tags: [ never, setup, host ]
    - role: ia_containers
      tags: [ never, ia ]
    - role: dev_env
      tags: [ dev ]
    - role: zsh
      tags: [ zsh, host ]
    - role: banking
      tags: [ bank ]
    - role: gaming
      tags: [ steam, game, host ]
    - role: flatpak
      tags: [ flatpak, chrome, spotify, app, irpf, git, host ]
    - role: rclone
      tags: [ rclone ]

  post_tasks:
    - name: 📢 NOTIFICAÇÕES FINAIS
      debug:
        msg:
          - "=========================================================="        
          - "Para testar o warsaw:"
          - "https://127.0.0.1:30900/"
          - "=========================================================="
          - "⚠️  RECOMENDAÇÕES PARA O HOST (TAG 'host'):"
          - "1. TPM: sudo sdbootutil unenroll --method tpm2"
          - "2. TPM: sudo sdbootutil enroll --method tpm2"
          - "3. BOOT: Reinicie a máquina para aplicar kernel/brilho."
          - "=========================================================="
      tags: [ always ]
